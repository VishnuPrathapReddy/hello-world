name: Java Deployment

on:
  push:


permissions:
  contents: read

jobs:

  # ==========================================================
  # BUILD
  # ==========================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java
        run: |
          java -version
          mvn -version

      # pom.xml is inside hello-world/
      - name: Build and Test
        working-directory: ./hello-world
        run: |
          set -euo pipefail

          mvn \
            --batch-mode \
            --errors \
            --fail-at-end \
            clean package

      - name: Find JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "JAR files:"
          find hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

          JAR=$(find hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -not -name "*-sources.jar" \
            -not -name "*-javadoc.jar" \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR found."
            exit 1
          fi

          echo "Found JAR:"
          echo "$JAR"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: hello-world/target/*.jar
          if-no-files-found: error


  # ==========================================================
  # DEPLOY
  # ==========================================================
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Download JAR
      # --------------------------------------------------------
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifact

      - name: Check downloaded JAR
        run: |
          set -euo pipefail

          echo "Downloaded artifact:"
          ls -lah artifact/

          JAR=$(find artifact \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: JAR not found."
            exit 1
          fi

          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # SSH KEY
      # --------------------------------------------------------
      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY is empty."
            exit 1
          fi

          umask 077

          printf '%s\n' "$EC2_SSH_KEY" > key.pem

          chmod 600 key.pem

          echo "Validating SSH key..."

          ssh-keygen -y -f key.pem > /tmp/public-key

          echo "SSH key is valid."

          echo "Key fingerprint:"
          ssh-keygen -lf /tmp/public-key


      # --------------------------------------------------------
      # SSH HOST
      # --------------------------------------------------------
      - name: Configure known hosts
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST is empty."
            exit 1
          fi

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts


      # --------------------------------------------------------
      # TEST SSH
      # --------------------------------------------------------
      - name: Test SSH
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"

          echo "======================================"
          echo "Testing SSH"
          echo "======================================"

          echo "Target: $SSH_TARGET"

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$SSH_TARGET" \
            "echo SSH SUCCESS; whoami; hostname"


      # ========================================================
      # UPLOAD JAR
      # ========================================================
      - name: Upload application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"

          echo "======================================"
          echo "Preparing /opt/myapp"
          echo "======================================"

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE'

          set -euo pipefail

          sudo mkdir -p /opt/myapp

          sudo chown ec2-user:ec2-user /opt/myapp

          sudo chmod 755 /opt/myapp

          echo "Application directory ready."

          REMOTE


          echo "======================================"
          echo "Uploading JAR"
          echo "======================================"

          scp \
            -i key.pem \
            -o BatchMode=yes \
            "$JAR_PATH" \
            "$SSH_TARGET:/opt/myapp/app.jar"

          echo "JAR uploaded."


      # ========================================================
      # VERIFY JAR
      # ========================================================
      - name: Verify application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE'

          set -euo pipefail

          if [ ! -f /opt/myapp/app.jar ]; then
            echo "ERROR: JAR does not exist."
            exit 1
          fi

          if [ ! -s /opt/myapp/app.jar ]; then
            echo "ERROR: JAR is empty."
            exit 1
          fi

          echo "Application JAR:"
          ls -lh /opt/myapp/app.jar

          REMOTE


      # ========================================================
      # INSTALL JAVA + CREATE SYSTEMD + START APPLICATION
      # ========================================================
      - name: Install Java and start application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"

          echo "======================================"
          echo "Connecting to EC2"
          echo "======================================"

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail


          APP_DIR="/opt/myapp"
          APP_JAR="$APP_DIR/app.jar"
          SERVICE_NAME="myapp"
          SERVICE_FILE="/etc/systemd/system/myapp.service"


          echo
          echo "======================================"
          echo "1. CHECKING JAVA"
          echo "======================================"


          # ====================================================
          # JAVA CHECK
          # ====================================================

          JAVA_OK=false


          if command -v java >/dev/null 2>&1; then

            echo "Java is already installed."

            java -version


            if java -version 2>&1 | grep -q '"17\.'; then

              JAVA_OK=true

              echo "Java 17 detected."

            else

              echo "Java is not Java 17."

            fi

          else

            echo "Java is not installed."

          fi


          # ====================================================
          # INSTALL JAVA
          # ====================================================

          if [ "$JAVA_OK" = false ]; then

            echo
            echo "Installing Java 17..."


            if [ -f /etc/os-release ] && \
               grep -qi "Amazon Linux" /etc/os-release; then

              echo "Amazon Linux detected."


              if command -v dnf >/dev/null 2>&1; then

                sudo dnf install -y java-17-amazon-corretto

              elif command -v yum >/dev/null 2>&1; then

                sudo yum install -y java-17-amazon-corretto

              else

                echo "ERROR: yum/dnf not found."
                exit 1

              fi


            elif command -v apt-get >/dev/null 2>&1; then

              echo "Debian/Ubuntu detected."

              sudo apt-get update

              sudo apt-get install -y openjdk-17-jdk


            else

              echo "ERROR: Unsupported Linux distribution."

              cat /etc/os-release || true

              exit 1

            fi

          fi


          # ====================================================
          # VERIFY JAVA
          # ====================================================

          echo
          echo "======================================"
          echo "2. VERIFYING JAVA"
          echo "======================================"


          if ! command -v java >/dev/null 2>&1; then

            echo "ERROR: Java command not found."

            exit 1

          fi


          JAVA_BIN="$(command -v java)"

          JAVA_BIN="$(readlink -f "$JAVA_BIN")"


          echo "Java executable:"
          echo "$JAVA_BIN"


          java -version


          if ! java -version 2>&1 | grep -q '"17\.'; then

            echo "ERROR: Java 17 is not active."

            exit 1

          fi


          # ====================================================
          # VERIFY JAR
          # ====================================================

          echo
          echo "======================================"
          echo "3. VERIFYING APPLICATION"
          echo "======================================"


          if [ ! -f "$APP_JAR" ]; then

            echo "ERROR: Application JAR missing:"
            echo "$APP_JAR"

            exit 1

          fi


          ls -lh "$APP_JAR"


          # ====================================================
          # BACKUP PREVIOUS JAR
          # ====================================================

          if [ -f "$APP_DIR/app.jar" ]; then

            echo "Application JAR exists."

          fi


          # ====================================================
          # CREATE SYSTEMD SERVICE
          # ====================================================

          echo
          echo "======================================"
          echo "4. CREATING SYSTEMD SERVICE"
          echo "======================================"


          echo "Service file:"
          echo "$SERVICE_FILE"


          sudo tee "$SERVICE_FILE" > /dev/null <<EOF
          [Unit]
          Description=Hello World Java Application
          After=network.target

          [Service]
          Type=simple
          User=ec2-user
          Group=ec2-user
          WorkingDirectory=/opt/myapp
          ExecStart=$JAVA_BIN -jar /opt/myapp/app.jar
          Restart=always
          RestartSec=5
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          EOF


          echo
          echo "Service file contents:"
          echo "--------------------------------------"

          sudo cat "$SERVICE_FILE"

          echo "--------------------------------------"


          # ====================================================
          # VERIFY FILE
          # ====================================================

          if [ ! -f "$SERVICE_FILE" ]; then

            echo "ERROR: systemd service file was NOT created."

            exit 1

          fi


          echo "Systemd service file exists."


          # ====================================================
          # SYSTEMD RELOAD
          # ====================================================

          echo
          echo "======================================"
          echo "5. RELOADING SYSTEMD"
          echo "======================================"


          sudo systemctl daemon-reload


          # ====================================================
          # VERIFY SYSTEMD
          # ====================================================

          echo
          echo "Checking systemd configuration..."


          sudo systemctl cat "$SERVICE_NAME"


          # ====================================================
          # ENABLE SERVICE
          # ====================================================

          echo
          echo "======================================"
          echo "6. ENABLING SERVICE"
          echo "======================================"


          sudo systemctl enable "$SERVICE_NAME"


          # ====================================================
          # STOP OLD SERVICE IF RUNNING
          # ====================================================

          echo
          echo "======================================"
          echo "7. STARTING APPLICATION"
          echo "======================================"


          if sudo systemctl is-active --quiet "$SERVICE_NAME"; then

            echo "Application is currently running."

            echo "Restarting..."

            sudo systemctl restart "$SERVICE_NAME"

          else

            echo "Application is not running."

            echo "Starting..."

            sudo systemctl start "$SERVICE_NAME"

          fi


          # ====================================================
          # WAIT FOR APPLICATION
          # ====================================================

          echo
          echo "Waiting for application..."


          for i in {1..20}; do

            if sudo systemctl is-active --quiet "$SERVICE_NAME"; then

              echo
              echo "======================================"
              echo "APPLICATION STARTED SUCCESSFULLY"
              echo "======================================"

              sudo systemctl \
                --no-pager \
                status "$SERVICE_NAME"

              exit 0

            fi


            echo "Attempt $i/20"

            sleep 2

          done


          # ====================================================
          # FAILURE
          # ====================================================

          echo
          echo "======================================"
          echo "APPLICATION FAILED"
          echo "======================================"


          echo
          echo "Systemd status:"

          sudo systemctl \
            --no-pager \
            status "$SERVICE_NAME" || true


          echo
          echo "Systemd logs:"

          sudo journalctl \
            -u "$SERVICE_NAME" \
            -n 100 \
            --no-pager || true


          exit 1


          REMOTE_SCRIPT


      # ========================================================
      # FINAL HEALTH CHECK
      # ========================================================
      - name: Final health check
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE'

          set -euo pipefail


          echo "======================================"
          echo "FINAL HEALTH CHECK"
          echo "======================================"


          if sudo systemctl is-active --quiet myapp; then

            echo "myapp is ACTIVE."

          else

            echo "ERROR: myapp is NOT ACTIVE."

            sudo systemctl status myapp --no-pager || true

            echo
            echo "Recent logs:"

            sudo journalctl \
              -u myapp \
              -n 100 \
              --no-pager || true

            exit 1

          fi


          echo
          echo "Service enabled status:"

          sudo systemctl is-enabled myapp


          echo
          echo "Application status:"

          sudo systemctl status myapp --no-pager


          echo
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"


          REMOTE


      # ========================================================
      # CLEANUP
      # ========================================================
      - name: Cleanup
        if: always()
        run: |
          rm -f key.pem
