name: Java Deployment

on:
  push:

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java and Maven
        run: |
          java -version
          javac -version
          mvn -version

      - name: Build and test
        working-directory: ./hello-world
        run: |
          mvn --batch-mode --errors --fail-at-end clean package

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated JAR..."

          find hello-world/target -maxdepth 1 -type f -name "*.jar" -print

          JAR_COUNT=$(find hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -not -name "*-sources.jar" \
            -not -name "*-javadoc.jar" \
            | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "ERROR: No JAR was generated."
            exit 1
          fi

          if [ "$JAR_COUNT" -gt 1 ]; then
            echo "ERROR: Multiple JARs were generated:"
            find hello-world/target \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              -not -name "*-sources.jar" \
              -not -name "*-javadoc.jar"

            exit 1
          fi

          echo "JAR verification successful."

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: hello-world/target/*.jar
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifact

      - name: Verify downloaded JAR
        run: |
          set -euo pipefail

          echo "Downloaded files:"
          ls -lah artifact/

          JAR_COUNT=$(find artifact \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            | wc -l)

          if [ "$JAR_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one JAR."
            exit 1
          fi

          JAR=$(find artifact \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print -quit)

          echo "JAR: $JAR"
          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"


      # ========================================================
      # VALIDATE CONFIG
      # ========================================================
      - name: Validate deployment configuration
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST variable is missing."
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is missing."
            exit 1
          fi

          echo "Deployment configuration OK."


      # ========================================================
      # SSH
      # ========================================================
      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          umask 077

          printf '%s\n' "$EC2_SSH_KEY" > key.pem

          chmod 600 key.pem

          ssh-keygen -y -f key.pem > /dev/null

          echo "SSH key is valid."


      - name: Configure SSH known hosts
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts


      - name: Test EC2 connection
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            ec2-user@"$EC2_HOST" \
            "echo 'EC2 SSH connection successful'"


      # ========================================================
      # JAVA
      # ========================================================
      - name: Check and install Java 17
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            ec2-user@"$EC2_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          echo "======================================"
          echo "Checking Java 17"
          echo "======================================"

          JAVA_OK=false

          if command -v java >/dev/null 2>&1; then

            echo "Java found:"
            java -version

            if java -version 2>&1 | grep -q '"17\.'; then
              JAVA_OK=true
              echo "Java 17 already installed."
            else
              echo "Java exists, but it is not Java 17."
            fi

          else

            echo "Java is not installed."

          fi


          if [ "$JAVA_OK" = false ]; then

            echo "Installing Java 17..."

            # Amazon Linux
            if [ -f /etc/os-release ] && \
               grep -qi "Amazon Linux" /etc/os-release; then

              if command -v dnf >/dev/null 2>&1; then

                sudo dnf install -y java-17-amazon-corretto

              elif command -v yum >/dev/null 2>&1; then

                sudo yum install -y java-17-amazon-corretto

              else

                echo "ERROR: dnf/yum not found."
                exit 1

              fi


            # Ubuntu/Debian
            elif command -v apt-get >/dev/null 2>&1; then

              sudo apt-get update
              sudo apt-get install -y openjdk-17-jdk


            else

              echo "ERROR: Unsupported Linux distribution."
              exit 1

            fi

          fi


          echo
          echo "Final Java version:"

          java -version


          if ! java -version 2>&1 | grep -q '"17\.'; then

            echo "ERROR: Java 17 is not available."
            exit 1

          fi

          echo "Java 17 is ready."

          REMOTE_SCRIPT


      # ========================================================
      # APPLICATION DIRECTORY
      # ========================================================
      - name: Prepare application directory
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            ec2-user@"$EC2_HOST" \
            "sudo mkdir -p /opt/myapp && sudo chown ec2-user:ec2-user /opt/myapp"

          echo "/opt/myapp is ready."


      # ========================================================
      # UPLOAD
      # ========================================================
      - name: Upload JAR to EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          echo "Uploading JAR..."

          scp \
            -i key.pem \
            -o BatchMode=yes \
            "$JAR_PATH" \
            ec2-user@"$EC2_HOST":/opt/myapp/app.jar

          echo "JAR uploaded successfully."


      # ========================================================
      # VERIFY JAR
      # ========================================================
      - name: Verify JAR on EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            ec2-user@"$EC2_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          if [ ! -s /opt/myapp/app.jar ]; then
            echo "ERROR: app.jar does not exist or is empty."
            exit 1
          fi

          chmod 644 /opt/myapp/app.jar

          echo "Application JAR:"
          ls -lh /opt/myapp/app.jar

          REMOTE_SCRIPT


      # ========================================================
      # START / RESTART
      # ========================================================
      - name: Start or restart application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            ec2-user@"$EC2_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          SERVICE="myapp"

          echo "======================================"
          echo "Checking systemd service"
          echo "======================================"


          if ! systemctl list-unit-files | \
             grep -q "^${SERVICE}.service"; then

            echo "ERROR: ${SERVICE}.service does not exist."

            echo
            echo "Expected:"
            echo "/etc/systemd/system/myapp.service"

            exit 1

          fi


          sudo systemctl daemon-reload

          sudo systemctl enable "$SERVICE"


          echo
          echo "======================================"
          echo "Starting application"
          echo "======================================"


          if sudo systemctl is-active --quiet "$SERVICE"; then

            echo "Application is already running."
            echo "Restarting..."

            sudo systemctl restart "$SERVICE"

          else

            echo "Application is not running."
            echo "Starting..."

            sudo systemctl start "$SERVICE"

          fi


          echo
          echo "Waiting for application..."


          for i in {1..15}; do

            if sudo systemctl is-active --quiet "$SERVICE"; then

              echo
              echo "======================================"
              echo "DEPLOYMENT SUCCESSFUL"
              echo "======================================"

              sudo systemctl --no-pager status "$SERVICE"

              exit 0

            fi

            echo "Waiting... $i/15"

            sleep 2

          done


          echo
          echo "======================================"
          echo "APPLICATION FAILED"
          echo "======================================"


          echo
          echo "Systemd status:"

          sudo systemctl --no-pager status "$SERVICE" || true


          echo
          echo "Application logs:"

          sudo journalctl \
            -u "$SERVICE" \
            -n 100 \
            --no-pager || true


          exit 1

          REMOTE_SCRIPT


      # ========================================================
      # CLEANUP
      # ========================================================
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f key.pem
