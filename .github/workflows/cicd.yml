name: Java Deployment

on:
  push:

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and test
        working-directory: ./hello-world
        run: |
          mvn --batch-mode --errors --fail-at-end clean package

      - name: Find generated JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated JAR files:"
          find hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

          JAR_COUNT=$(find hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -not -name "*-sources.jar" \
            -not -name "*-javadoc.jar" \
            | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "ERROR: No JAR was generated."
            exit 1
          fi

          if [ "$JAR_COUNT" -gt 1 ]; then
            echo "ERROR: More than one deployable JAR was generated."
            find hello-world/target \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              -not -name "*-sources.jar" \
              -not -name "*-javadoc.jar"
            exit 1
          fi

          JAR=$(find hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -not -name "*-sources.jar" \
            -not -name "*-javadoc.jar" \
            -print -quit)

          echo "JAR found: $JAR"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: hello-world/target/*.jar
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Download JAR
      # ----------------------------------------------------------
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifact

      - name: Verify downloaded JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded files:"
          ls -lah artifact

          JAR_COUNT=$(find artifact \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            | wc -l)

          if [ "$JAR_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one JAR."
            exit 1
          fi

          JAR_PATH=$(find artifact \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print -quit)

          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

          echo "JAR: $JAR_PATH"


      # ----------------------------------------------------------
      # Validate GitHub variables/secrets
      # ----------------------------------------------------------
      - name: Validate deployment configuration
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          echo "Checking deployment configuration..."

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST is empty."
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "ERROR: EC2_USER is empty."
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY is empty."
            exit 1
          fi

          # Your EC2 username is known to be ec2-user.
          if [[ "$EC2_USER" != "ec2-user" ]]; then
            echo "ERROR: EC2_USER must be exactly:"
            echo "ec2-user"
            echo
            echo "Current value is invalid."
            exit 1
          fi

          # Host must only contain a hostname/IP.
          if [[ "$EC2_HOST" =~ [^a-zA-Z0-9.-] ]]; then
            echo "ERROR: EC2_HOST contains invalid characters."
            echo "Only an IP address or hostname is allowed."
            exit 1
          fi

          echo "EC2_HOST = [$EC2_HOST]"
          echo "EC2_USER = [$EC2_USER]"
          echo "Deployment configuration is valid."


      # ----------------------------------------------------------
      # Prepare SSH private key
      # ----------------------------------------------------------
      - name: Prepare SSH key
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          umask 077

          printf '%s\n' "$EC2_SSH_KEY" > key.pem

          chmod 600 key.pem

          echo "Checking SSH private key..."

          ssh-keygen -y -f key.pem > /dev/null

          echo "SSH private key is valid."


      # ----------------------------------------------------------
      # Configure known hosts
      # ----------------------------------------------------------
      - name: Configure SSH known hosts
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "SSH host key configured."


      # ----------------------------------------------------------
      # Test SSH
      # ----------------------------------------------------------
      - name: Test EC2 SSH connection
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Testing EC2 SSH connection"
          echo "======================================"

          echo "Host: [$EC2_HOST]"
          echo "User: [$EC2_USER]"

          if [[ "$EC2_USER" != "ec2-user" ]]; then
            echo "ERROR: Invalid EC2_USER."
            exit 1
          fi

          SSH_TARGET="${EC2_USER}@${EC2_HOST}"

          echo "SSH target: [$SSH_TARGET]"

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$SSH_TARGET" \
            "echo 'EC2 SSH connection successful'; whoami; hostname"


      # ----------------------------------------------------------
      # Check/install Java 17
      # ----------------------------------------------------------
      - name: Check and install Java 17
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -euo pipefail

          SSH_TARGET="${EC2_USER}@${EC2_HOST}"

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          echo "======================================"
          echo "Checking Java"
          echo "======================================"

          JAVA_OK=false

          if command -v java >/dev/null 2>&1; then

            echo "Java is installed:"
            java -version

            if java -version 2>&1 | grep -q '"17\.'; then
              JAVA_OK=true
              echo "Java 17 is already installed."
            else
              echo "Java is installed but it is not Java 17."
            fi

          else

            echo "Java is not installed."

          fi


          if [ "$JAVA_OK" = false ]; then

            echo "======================================"
            echo "Installing Java 17"
            echo "======================================"

            if [ -f /etc/os-release ] && \
               grep -qi "Amazon Linux" /etc/os-release; then

              echo "Amazon Linux detected."

              if command -v dnf >/dev/null 2>&1; then

                sudo dnf install -y java-17-amazon-corretto

              elif command -v yum >/dev/null 2>&1; then

                sudo yum install -y java-17-amazon-corretto

              else

                echo "ERROR: dnf/yum not available."
                exit 1

              fi

            elif command -v apt-get >/dev/null 2>&1; then

              echo "Ubuntu/Debian detected."

              sudo apt-get update
              sudo apt-get install -y openjdk-17-jdk

            else

              echo "ERROR: Unsupported Linux distribution."
              exit 1

            fi

          fi


          echo "======================================"
          echo "Verifying Java 17"
          echo "======================================"

          if ! command -v java >/dev/null 2>&1; then
            echo "ERROR: Java is still not available."
            exit 1
          fi

          java -version

          if ! java -version 2>&1 | grep -q '"17\.'; then
            echo "ERROR: Java 17 is not active."
            exit 1
          fi

          echo "Java 17 is ready."

          REMOTE_SCRIPT


      # ----------------------------------------------------------
      # Prepare application directory
      # ----------------------------------------------------------
      - name: Prepare application directory
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -euo pipefail

          SSH_TARGET="${EC2_USER}@${EC2_HOST}"

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          APP_DIR="/opt/myapp"

          echo "Creating application directory..."

          sudo mkdir -p "$APP_DIR"

          sudo chown ec2-user:ec2-user "$APP_DIR"

          sudo chmod 755 "$APP_DIR"

          echo "Application directory ready:"
          ls -ld "$APP_DIR"

          REMOTE_SCRIPT


      # ----------------------------------------------------------
      # Upload JAR
      # ----------------------------------------------------------
      - name: Upload JAR to EC2
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -euo pipefail

          SSH_TARGET="${EC2_USER}@${EC2_HOST}"

          echo "Uploading:"
          echo "$JAR_PATH"

          scp \
            -i key.pem \
            -o BatchMode=yes \
            "$JAR_PATH" \
            "$SSH_TARGET:/opt/myapp/app.jar"

          echo "JAR upload successful."


      # ----------------------------------------------------------
      # Verify uploaded JAR
      # ----------------------------------------------------------
      - name: Verify JAR on EC2
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -euo pipefail

          SSH_TARGET="${EC2_USER}@${EC2_HOST}"

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          APP_JAR="/opt/myapp/app.jar"

          if [ ! -f "$APP_JAR" ]; then
            echo "ERROR: $APP_JAR does not exist."
            exit 1
          fi

          if [ ! -s "$APP_JAR" ]; then
            echo "ERROR: $APP_JAR is empty."
            exit 1
          fi

          chmod 644 "$APP_JAR"

          echo "JAR successfully uploaded:"
          ls -lh "$APP_JAR"

          REMOTE_SCRIPT


      # ----------------------------------------------------------
      # Start/restart application
      # ----------------------------------------------------------
      - name: Start or restart application
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -euo pipefail

          SSH_TARGET="${EC2_USER}@${EC2_HOST}"

          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          SERVICE="myapp"
          APP_DIR="/opt/myapp"
          APP_JAR="$APP_DIR/app.jar"
          BACKUP_JAR="$APP_DIR/app.jar.backup"


          echo "======================================"
          echo "Checking systemd service"
          echo "======================================"


          if ! systemctl list-unit-files \
             --type=service \
             | grep -q "^${SERVICE}.service"; then

            echo "ERROR: systemd service does not exist."

            echo
            echo "Expected service:"
            echo "/etc/systemd/system/myapp.service"

            exit 1

          fi


          if [ ! -s "$APP_JAR" ]; then

            echo "ERROR: Application JAR does not exist."

            exit 1

          fi


          # ------------------------------------------------------
          # Backup existing JAR
          # ------------------------------------------------------
          if [ -f "$APP_JAR" ]; then

            echo "Backing up current application..."

            sudo cp "$APP_JAR" "$BACKUP_JAR"

            sudo chmod 644 "$BACKUP_JAR"

          fi


          # ------------------------------------------------------
          # Reload systemd
          # ------------------------------------------------------
          sudo systemctl daemon-reload


          # ------------------------------------------------------
          # Enable service
          # ------------------------------------------------------
          sudo systemctl enable "$SERVICE"


          # ------------------------------------------------------
          # Start or restart
          # ------------------------------------------------------
          echo "======================================"
          echo "Starting application"
          echo "======================================"


          if sudo systemctl is-active --quiet "$SERVICE"; then

            echo "Application is running."
            echo "Restarting..."

            sudo systemctl restart "$SERVICE"

          else

            echo "Application is stopped."
            echo "Starting..."

            sudo systemctl start "$SERVICE"

          fi


          # ------------------------------------------------------
          # Wait for service
          # ------------------------------------------------------
          echo "Waiting for application..."


          for i in {1..15}; do

            if sudo systemctl is-active --quiet "$SERVICE"; then

              echo
              echo "======================================"
              echo "DEPLOYMENT SUCCESSFUL"
              echo "======================================"

              sudo systemctl --no-pager status "$SERVICE"

              exit 0

            fi

            echo "Attempt $i/15..."

            sleep 2

          done


          # ======================================================
          # DEPLOYMENT FAILED
          # ======================================================
          echo
          echo "======================================"
          echo "DEPLOYMENT FAILED"
          echo "======================================"


          echo
          echo "Systemd status:"

          sudo systemctl \
            --no-pager \
            status "$SERVICE" || true


          echo
          echo "Application logs:"

          sudo journalctl \
            -u "$SERVICE" \
            -n 100 \
            --no-pager || true


          # ======================================================
          # ROLLBACK
          # ======================================================
          if [ -f "$BACKUP_JAR" ]; then

            echo
            echo "======================================"
            echo "Rolling back previous version"
            echo "======================================"


            sudo cp "$BACKUP_JAR" "$APP_JAR"

            sudo chmod 644 "$APP_JAR"

            sudo systemctl restart "$SERVICE"

            sleep 5


            if sudo systemctl is-active --quiet "$SERVICE"; then

              echo "Rollback successful."

            else

              echo "WARNING: Rollback failed."

              sudo systemctl \
                --no-pager \
                status "$SERVICE" || true

              sudo journalctl \
                -u "$SERVICE" \
                -n 100 \
                --no-pager || true

            fi

          else

            echo "No previous JAR available."
            echo "Rollback is not possible."

          fi


          exit 1

          REMOTE_SCRIPT


      # ----------------------------------------------------------
      # Cleanup
      # ----------------------------------------------------------
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f key.pem
