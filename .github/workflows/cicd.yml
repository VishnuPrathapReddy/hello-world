name: Java Deployment

on:
  push:


permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v5


      # ----------------------------------------------------------
      # Java 17
      # ----------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ----------------------------------------------------------
      # Check Java and Maven
      # ----------------------------------------------------------
      - name: Check Java and Maven
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Maven:"
          mvn -version


      # ----------------------------------------------------------
      # Build Maven project
      #
      # pom.xml is inside hello-world/
      # ----------------------------------------------------------
      - name: Build and test
        working-directory: ./hello-world
        run: |
          set -euo pipefail

          mvn \
            --batch-mode \
            --errors \
            --fail-at-end \
            clean package


      # ----------------------------------------------------------
      # Find JAR
      # ----------------------------------------------------------
      - name: Verify generated JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated JAR files:"
          find hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print


          JAR_COUNT=$(find hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -not -name "*-sources.jar" \
            -not -name "*-javadoc.jar" \
            | wc -l)


          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "ERROR: No deployable JAR was generated."
            exit 1
          fi


          if [ "$JAR_COUNT" -gt 1 ]; then
            echo "ERROR: Multiple deployable JARs were generated."

            find hello-world/target \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              -not -name "*-sources.jar" \
              -not -name "*-javadoc.jar"

            exit 1
          fi


          JAR_PATH=$(find hello-world/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -not -name "*-sources.jar" \
            -not -name "*-javadoc.jar" \
            -print -quit)


          echo "JAR found:"
          echo "$JAR_PATH"


      # ----------------------------------------------------------
      # Upload artifact
      # ----------------------------------------------------------
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: hello-world/target/*.jar
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Download artifact
      # ----------------------------------------------------------
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifact


      # ----------------------------------------------------------
      # Find downloaded JAR
      # ----------------------------------------------------------
      - name: Verify downloaded JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded files:"
          ls -lah artifact/


          JAR_COUNT=$(find artifact \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            | wc -l)


          if [ "$JAR_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one JAR."
            echo "Found: $JAR_COUNT"
            exit 1
          fi


          JAR_PATH=$(find artifact \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print -quit)


          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"

          echo "Using JAR:"
          echo "$JAR_PATH"


      # ========================================================
      # VALIDATE CONFIGURATION
      # ========================================================
      - name: Validate deployment configuration
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          echo "Checking deployment configuration..."


          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST is empty."
            exit 1
          fi


          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY is empty."
            exit 1
          fi


          # Host must be only an IP/hostname.
          if [[ "$EC2_HOST" =~ [^a-zA-Z0-9.-] ]]; then
            echo "ERROR: EC2_HOST contains invalid characters."
            echo "Current value: [$EC2_HOST]"
            exit 1
          fi


          echo "EC2_HOST: [$EC2_HOST]"
          echo "EC2_USER: [ec2-user]"

          echo "Configuration is valid."


      # ========================================================
      # PREPARE SSH KEY
      # ========================================================
      - name: Prepare SSH key
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          umask 077

          printf '%s\n' "$EC2_SSH_KEY" > key.pem

          chmod 600 key.pem


          echo "Validating private key..."

          ssh-keygen -y -f key.pem > /tmp/github-public-key.pub


          echo "SSH private key is valid."

          echo "GitHub SSH key fingerprint:"
          ssh-keygen -lf /tmp/github-public-key.pub


      # ========================================================
      # KNOWN HOSTS
      # ========================================================
      - name: Configure SSH known hosts
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh


          echo "Getting EC2 host key..."

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


          chmod 600 ~/.ssh/known_hosts

          echo "Known host configured."


      # ========================================================
      # TEST SSH
      # ========================================================
      - name: Test EC2 SSH connection
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Testing EC2 SSH connection"
          echo "======================================"


          SSH_TARGET="ec2-user@${EC2_HOST}"


          echo "Host: [$EC2_HOST]"
          echo "User: [ec2-user]"
          echo "SSH target: [$SSH_TARGET]"


          ssh \
            -i key.pem \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$SSH_TARGET" \
            "echo 'EC2 SSH connection successful'; echo 'Remote user:'; whoami; echo 'Hostname:'; hostname"


      # ========================================================
      # CHECK / INSTALL JAVA
      # ========================================================
      - name: Check and install Java 17
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"


          ssh \
            -i key.pem \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail


          echo "======================================"
          echo "Checking Java"
          echo "======================================"


          JAVA_OK=false


          # ----------------------------------------------------
          # Check Java
          # ----------------------------------------------------
          if command -v java >/dev/null 2>&1; then

            echo "Java is installed:"
            java -version


            if java -version 2>&1 | grep -q '"17\.'; then

              JAVA_OK=true

              echo "Java 17 is already installed."

            else

              echo "Java exists, but it is not Java 17."

            fi

          else

            echo "Java is not installed."

          fi


          # ----------------------------------------------------
          # Install Java if required
          # ----------------------------------------------------
          if [ "$JAVA_OK" = false ]; then

            echo
            echo "======================================"
            echo "Installing Java 17"
            echo "======================================"


            if [ -f /etc/os-release ] && \
               grep -qi "Amazon Linux" /etc/os-release; then

              echo "Amazon Linux detected."


              if command -v dnf >/dev/null 2>&1; then

                sudo dnf install -y java-17-amazon-corretto

              elif command -v yum >/dev/null 2>&1; then

                sudo yum install -y java-17-amazon-corretto

              else

                echo "ERROR: dnf/yum not available."
                exit 1

              fi


            elif command -v apt-get >/dev/null 2>&1; then

              echo "Ubuntu/Debian detected."


              sudo apt-get update

              sudo apt-get install -y openjdk-17-jdk


            else

              echo "ERROR: Unsupported Linux distribution."
              exit 1

            fi

          fi


          # ----------------------------------------------------
          # Verify Java
          # ----------------------------------------------------
          echo
          echo "======================================"
          echo "Verifying Java 17"
          echo "======================================"


          if ! command -v java >/dev/null 2>&1; then

            echo "ERROR: Java command not found after installation."
            exit 1

          fi


          java -version


          JAVA_VERSION=$(java -version 2>&1 | head -n 1)

          echo "Java version: $JAVA_VERSION"


          if ! java -version 2>&1 | grep -q '"17\.'; then

            echo "ERROR: Java 17 is not active."
            exit 1

          fi


          echo "Java 17 is ready."


          echo
          echo "Java executable:"
          readlink -f "$(command -v java)" || true


          REMOTE_SCRIPT


      # ========================================================
      # PREPARE APPLICATION DIRECTORY
      # ========================================================
      - name: Prepare application directory
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"


          ssh \
            -i key.pem \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail


          APP_DIR="/opt/myapp"


          echo "======================================"
          echo "Preparing application directory"
          echo "======================================"


          sudo mkdir -p "$APP_DIR"


          sudo chown ec2-user:ec2-user "$APP_DIR"


          sudo chmod 755 "$APP_DIR"


          echo "Application directory:"
          ls -ld "$APP_DIR"


          REMOTE_SCRIPT


      # ========================================================
      # BACKUP CURRENT JAR
      # ========================================================
      - name: Backup current application
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"


          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail


          APP_JAR="/opt/myapp/app.jar"
          BACKUP_JAR="/opt/myapp/app.jar.backup"


          if [ -f "$APP_JAR" ]; then

            echo "Backing up current application..."

            sudo cp "$APP_JAR" "$BACKUP_JAR"

            sudo chmod 644 "$BACKUP_JAR"

            echo "Backup created."

          else

            echo "No previous application found."
            echo "This appears to be the first deployment."

          fi


          REMOTE_SCRIPT


      # ========================================================
      # UPLOAD JAR
      # ========================================================
      - name: Upload JAR to EC2
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"


          echo "======================================"
          echo "Uploading JAR"
          echo "======================================"


          echo "Local JAR:"
          echo "$JAR_PATH"


          scp \
            -i key.pem \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$JAR_PATH" \
            "$SSH_TARGET:/opt/myapp/app.jar"


          echo "JAR uploaded successfully."


      # ========================================================
      # VERIFY JAR
      # ========================================================
      - name: Verify JAR on EC2
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"


          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail


          APP_JAR="/opt/myapp/app.jar"


          if [ ! -f "$APP_JAR" ]; then

            echo "ERROR: JAR does not exist:"
            echo "$APP_JAR"

            exit 1

          fi


          if [ ! -s "$APP_JAR" ]; then

            echo "ERROR: JAR is empty."

            exit 1

          fi


          chmod 644 "$APP_JAR"


          echo "JAR uploaded:"
          ls -lh "$APP_JAR"


          REMOTE_SCRIPT


      # ========================================================
      # CREATE / UPDATE SYSTEMD SERVICE
      # ========================================================
      - name: Configure systemd service
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"


          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail


          SERVICE_NAME="myapp"
          SERVICE_FILE="/etc/systemd/system/myapp.service"


          echo "======================================"
          echo "Configuring systemd"
          echo "======================================"


          # ----------------------------------------------------
          # Find Java
          # ----------------------------------------------------
          JAVA_BIN=$(command -v java || true)


          if [ -z "$JAVA_BIN" ]; then

            echo "ERROR: Java is not installed."
            exit 1

          fi


          JAVA_BIN=$(readlink -f "$JAVA_BIN")


          echo "Java executable:"
          echo "$JAVA_BIN"


          # ----------------------------------------------------
          # Create service
          # ----------------------------------------------------
          sudo tee "$SERVICE_FILE" > /dev/null <<EOF
          [Unit]
          Description=Hello World Java Application
          After=network.target

          [Service]
          Type=simple

          User=ec2-user
          Group=ec2-user

          WorkingDirectory=/opt/myapp

          ExecStart=$JAVA_BIN -jar /opt/myapp/app.jar

          Restart=always
          RestartSec=5

          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          EOF


          echo "Service file created:"


          sudo cat "$SERVICE_FILE"


          # ----------------------------------------------------
          # Reload systemd
          # ----------------------------------------------------
          sudo systemctl daemon-reload


          # ----------------------------------------------------
          # Enable service
          # ----------------------------------------------------
          sudo systemctl enable "$SERVICE_NAME"


          echo "systemd service configured."


          REMOTE_SCRIPT


      # ========================================================
      # START / RESTART APPLICATION
      # ========================================================
      - name: Start or restart application
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"


          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail


          SERVICE="myapp"


          echo "======================================"
          echo "Starting application"
          echo "======================================"


          # ----------------------------------------------------
          # Verify service exists
          # ----------------------------------------------------
          if ! systemctl list-unit-files \
              --type=service \
              | grep -q "^${SERVICE}.service"; then

            echo "ERROR: systemd service was not created."

            exit 1

          fi


          # ----------------------------------------------------
          # Restart/start service
          # ----------------------------------------------------
          if sudo systemctl is-active --quiet "$SERVICE"; then

            echo "Application is already running."
            echo "Restarting application..."

            sudo systemctl restart "$SERVICE"

          else

            echo "Application is not running."
            echo "Starting application..."

            sudo systemctl start "$SERVICE"

          fi


          # ----------------------------------------------------
          # Wait for application
          # ----------------------------------------------------
          echo
          echo "Waiting for application to start..."


          for i in {1..20}; do

            if sudo systemctl is-active --quiet "$SERVICE"; then

              echo
              echo "======================================"
              echo "APPLICATION IS RUNNING"
              echo "======================================"


              sudo systemctl \
                --no-pager \
                status "$SERVICE"


              exit 0

            fi


            echo "Attempt $i/20..."

            sleep 2

          done


          # ====================================================
          # APPLICATION FAILED
          # ====================================================
          echo
          echo "======================================"
          echo "APPLICATION FAILED TO START"
          echo "======================================"


          echo
          echo "Systemd status:"


          sudo systemctl \
            --no-pager \
            status "$SERVICE" || true


          echo
          echo "Application logs:"


          sudo journalctl \
            -u "$SERVICE" \
            -n 100 \
            --no-pager || true


          exit 1


          REMOTE_SCRIPT


      # ========================================================
      # HEALTH CHECK
      # ========================================================
      - name: Check application service
        shell: bash
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail

          SSH_TARGET="ec2-user@${EC2_HOST}"


          ssh \
            -i key.pem \
            -o BatchMode=yes \
            "$SSH_TARGET" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail


          SERVICE="myapp"


          echo "======================================"
          echo "Final health check"
          echo "======================================"


          if sudo systemctl is-active --quiet "$SERVICE"; then

            echo "Service status: ACTIVE"

          else

            echo "Service status: NOT ACTIVE"

            sudo systemctl \
              --no-pager \
              status "$SERVICE" || true

            echo
            echo "Recent logs:"

            sudo journalctl \
              -u "$SERVICE" \
              -n 100 \
              --no-pager || true

            exit 1

          fi


          echo
          echo "Service enabled status:"

          sudo systemctl is-enabled "$SERVICE"


          echo
          echo "Application status:"

          sudo systemctl \
            --no-pager \
            status "$SERVICE"


          echo
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"


          REMOTE_SCRIPT


      # ========================================================
      # CLEANUP
      # ========================================================
      - name: Cleanup SSH private key
        if: always()
        shell: bash
        run: |
          rm -f key.pem
